services:
  dhole-agent-api:
    container_name: dhole-agent-api
    build:
      context: .
      dockerfile: Dockerfile
      target: api-final
      args:
        NUGET_USERNAME: ${NUGET_USERNAME:-github}
        NUGET_TOKEN: ${NUGET_TOKEN:-}
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Postgres__ConnectionString: ${AGENT_POSTGRES_CONNECTION_STRING}
      Redis__ConnectionString: ${AGENT_REDIS_CONNECTION_STRING}
      Hermes__BaseUrl: ${HERMES_GATEWAY_URL:-http://hermes-agent:8642}
      Hermes__ApiKey: ${HERMES_API_SERVER_KEY}
      Hermes__Model: ${HERMES_API_SERVER_MODEL_NAME:-hermes-agent}
      Hermes__ExecutePath: /v1/chat/completions
      Hermes__TimeoutSeconds: ${HERMES_AGENT_HTTP_TIMEOUT_SECONDS:-600}
      Browser__ProfilesPath: /data/browser-profiles
      CredentialProtection__KeyRingPath: /data/agent-keys
    volumes:
      - agent-data-protection-keys:/data/agent-keys
    ports:
      - "${AGENT_API_PORT:-5211}:8080"
    networks:
      - dhole-internal
    restart: unless-stopped

  dhole-agent-workers:
    container_name: dhole-agent-workers
    build:
      context: .
      dockerfile: Dockerfile
      target: worker-final
      args:
        NUGET_USERNAME: ${NUGET_USERNAME:-github}
        NUGET_TOKEN: ${NUGET_TOKEN:-}
    environment:
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Production}
      Postgres__ConnectionString: ${AGENT_POSTGRES_CONNECTION_STRING}
      Redis__ConnectionString: ${AGENT_REDIS_CONNECTION_STRING}
      Hermes__BaseUrl: ${HERMES_GATEWAY_URL:-http://hermes-agent:8642}
      Hermes__ApiKey: ${HERMES_API_SERVER_KEY}
      Hermes__Model: ${HERMES_API_SERVER_MODEL_NAME:-hermes-agent}
      Hermes__ExecutePath: /v1/chat/completions
      Hermes__TimeoutSeconds: ${HERMES_AGENT_HTTP_TIMEOUT_SECONDS:-600}
      Browser__ProfilesPath: /data/browser-profiles
      Browser__Headless: "true"
      CredentialProtection__KeyRingPath: /data/agent-keys
      MAERSK_USERNAME: ${MAERSK_USERNAME:-}
      MAERSK_PASSWORD: ${MAERSK_PASSWORD:-}
    volumes:
      - agent-browser-profiles:/data/browser-profiles
      - agent-data-protection-keys:/data/agent-keys
    shm_size: "2gb"
    networks:
      - dhole-internal
    restart: unless-stopped

volumes:
  agent-browser-profiles:
  agent-data-protection-keys:

networks:
  dhole-internal:
    external: true
    name: ${DHOLE_NETWORK:-dhole}
