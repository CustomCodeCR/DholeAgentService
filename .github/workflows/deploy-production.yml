name: Deploy Dhole Agent - Production

on:
  # Phase 8 guarded release: no implicit deployment from a Git push.
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_AGENT_PRODUCTION to authorize this release"
        type: string
        required: true
      backup_dir:
        description: "Absolute path to verified backups on the self-hosted runner"
        type: string
        required: true
      staging_run_id:
        description: "Successful recent staging deployment workflow run ID (develop)"
        type: string
        required: true

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: dhole-agent-production
  cancel-in-progress: false

env:
  COMPOSE_FILE: .dhole-system/deploy/docker-compose.services.yml
  DHOLE_IMAGE_TAG: latest
  DHOLE_NETWORK: dhole
  COMPOSE_PROJECT: dhole

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Checkout Agent
        uses: actions/checkout@v4

      - name: Confirm phase 8 manual release
        shell: bash
        env:
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_CONFIRMATION" == "DEPLOY_AGENT_PRODUCTION" ]] || { echo "Explicit release confirmation required" >&2; exit 1; }

      - name: Require successful recent staging acceptance
        shell: bash
        env:
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$STAGING_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid staging run ID" >&2; exit 1; }
          payload="$(curl --fail --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/CustomCodeCR/DholeAgentService/actions/runs/$STAGING_RUN_ID")"
          # A historical push-based staging success is not sufficient:
          # require a manually authorized release of the CURRENT develop commit.
          branch_payload="$(curl --fail --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/CustomCodeCR/DholeAgentService/branches/develop")"
          CURRENT_DEVELOP_SHA="$(printf '%s' "$branch_payload" | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])')"
          export CURRENT_DEVELOP_SHA
          printf '%s' "$payload" | python3 -c '
          import json, os, sys
          from datetime import datetime, timedelta, timezone
          run = json.load(sys.stdin)
          age = datetime.now(timezone.utc) - datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))
          accepted = (run.get("name") == "Deploy Dhole Agent - Staging"
                      and run.get("head_branch") == "develop"
                      and run.get("head_sha") == os.environ["CURRENT_DEVELOP_SHA"]
                      and run.get("event") == "workflow_dispatch"
                      and run.get("conclusion") == "success"
                      and timedelta(0) <= age < timedelta(hours=48))
          if not accepted:
              print("Require a successful manually verified staging deploy of current develop within 48h", file=sys.stderr)
              sys.exit(1)
          print("Current develop manual staging acceptance verified.")
          '

      - name: Load Dhole production infrastructure
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .dhole-system
          for attempt in $(seq 1 5); do
            if git clone --depth 1 --branch master https://github.com/CustomCodeCR/DholeSystem.git .dhole-system; then
              break
            fi

            rm -rf .dhole-system
            if [ "$attempt" -eq 5 ]; then
              echo "Unable to clone DholeSystem after 5 attempts. Check DNS/network access to github.com." >&2
              exit 1
            fi

            echo "DholeSystem clone failed (attempt $attempt/5). Retrying..."
            sleep $((attempt * 5))
          done
          mkdir -p "$RUNNER_TEMP/dhole-env"
          bash .dhole-system/deploy/prepare-environments.sh /opt/dhole/.env "$RUNNER_TEMP/dhole-env"
          echo "DHOLE_ENV_FILE=$RUNNER_TEMP/dhole-env/.env.production" >> "$GITHUB_ENV"

      - name: Phase 8 verify database and profile/key backups
        shell: bash
        env:
          PHASE8_BACKUP_DIR: ${{ inputs.backup_dir }}
        run: |
          set -euo pipefail
          bash scripts/maersk-phase8-preflight.sh production "$PHASE8_BACKUP_DIR" "$DHOLE_ENV_FILE"

      - name: Phase 8 isolated PostgreSQL restoration drill
        shell: bash
        env:
          PHASE8_BACKUP_DIR: ${{ inputs.backup_dir }}
        run: |
          set -euo pipefail
          bash scripts/maersk-phase8-restore-drill.sh "$PHASE8_BACKUP_DIR"

      - name: Ensure Agent database exists
        shell: bash
        run: |
          set -euo pipefail
          test -r "$DHOLE_ENV_FILE"

          AGENT_CONNECTION="$(grep -m1 '^AGENT_POSTGRES_CONNECTION_STRING=' "$DHOLE_ENV_FILE" | cut -d= -f2-)"
          if [ -z "$AGENT_CONNECTION" ]; then
            echo "AGENT_POSTGRES_CONNECTION_STRING is missing from $DHOLE_ENV_FILE" >&2
            exit 1
          fi

          connection_value() {
            printf '%s' "$AGENT_CONNECTION" | tr ';' '\n' | sed -n "s/^$1=//p" | head -n1
          }

          DB_HOST="$(connection_value Host)"
          DB_PORT="$(connection_value Port)"
          DB_NAME="$(connection_value Database)"
          DB_USER="$(connection_value Username)"
          DB_PASSWORD="$(connection_value Password)"

          DB_HOST="${DB_HOST:-postgres}"
          DB_PORT="${DB_PORT:-5432}"

          if ! [[ "$DB_NAME" =~ ^[A-Za-z0-9_]+$ ]]; then
            echo "Unsafe or empty Agent database name: $DB_NAME" >&2
            exit 1
          fi
          if [ -z "$DB_USER" ] || [ -z "$DB_PASSWORD" ]; then
            echo "Agent database username/password are missing." >&2
            exit 1
          fi

          for attempt in $(seq 1 30); do
            if docker run --rm --network "$DHOLE_NETWORK" \
              -e PGPASSWORD="$DB_PASSWORD" \
              postgres:16-alpine \
              pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d postgres >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "PostgreSQL is not reachable from network $DHOLE_NETWORK." >&2
              exit 1
            fi
            sleep 2
          done

          EXISTS="$(docker run --rm --network "$DHOLE_NETWORK" \
            -e PGPASSWORD="$DB_PASSWORD" \
            postgres:16-alpine \
            psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$DB_NAME'")"

          if [ "$EXISTS" != "1" ]; then
            docker run --rm --network "$DHOLE_NETWORK" \
              -e PGPASSWORD="$DB_PASSWORD" \
              postgres:16-alpine \
              createdb -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" "$DB_NAME"
            echo "Created Agent database: $DB_NAME"
          else
            echo "Agent database already exists: $DB_NAME"
          fi

      - name: Diagnose Agent execution statuses
        shell: bash
        run: |
          set -euo pipefail
          CONN="$(grep -m1 '^AGENT_POSTGRES_CONNECTION_STRING=' "$DHOLE_ENV_FILE" | cut -d= -f2-)"
          test -n "$CONN"
          connection_value() {
            printf '%s' "$CONN" | tr ';' '\n' | sed -n "s/^$1=//p" | head -n1
          }
          DB_HOST="$(connection_value Host)"
          DB_PORT="$(connection_value Port)"
          DB_NAME="$(connection_value Database)"
          DB_USER="$(connection_value Username)"
          DB_PASSWORD="$(connection_value Password)"
          test -n "$DB_NAME" && test -n "$DB_USER" && test -n "$DB_PASSWORD"

          docker run --rm --network "$DHOLE_NETWORK" -e PGPASSWORD="$DB_PASSWORD" postgres:16-alpine \
            psql -v ON_ERROR_STOP=1 -h "${DB_HOST:-postgres}" -p "${DB_PORT:-5432}" -U "$DB_USER" -d "$DB_NAME" \
            -c 'SELECT p.code AS provider, e.status, COUNT(*) AS executions
                FROM agent."AgentExecutions" e
                JOIN agent."AgentProviders" p ON p.id=e.provider_id
                GROUP BY p.code,e.status
                ORDER BY p.code,e.status;'

      - name: Free runner disk space before Docker builds
        shell: bash
        run: |
          set -euo pipefail

          echo "Disk usage before cleanup:"
          df -h /
          docker system df || true

          # Safe cleanup only: build cache, stopped containers and dangling image layers.
          # Named volumes are intentionally never pruned because they contain
          # PostgreSQL, MinIO, Ollama and other persistent Dhole data.
          docker builder prune -af || true
          docker container prune -f --filter "until=24h" || true
          # Preserve *tagged* rollback images; remove only dangling build layers.
          docker image prune -f || true

          echo "Disk usage after cleanup:"
          df -h /
          docker system df || true

          AVAILABLE_KB="$(df -Pk / | awk 'NR==2 {print $4}')"
          # Prior successful Agent builds needed considerably less than 1 GiB
          # of additional root space. Keep a conservative 5 GiB free-space
          # floor without ever pruning named Docker volumes or application data.
          MIN_REQUIRED_KB=$((5 * 1024 * 1024))
          echo "Root filesystem available: ${AVAILABLE_KB} KiB (minimum: ${MIN_REQUIRED_KB} KiB)"
          if [ "$AVAILABLE_KB" -lt "$MIN_REQUIRED_KB" ]; then
            echo "Insufficient free disk space for Agent Docker build. Need at least 5 GiB free." >&2
            exit 1
          fi

      - name: Ensure local Ollama and production Hermes
        shell: bash
        run: |
          set -euo pipefail
          docker network inspect "$DHOLE_NETWORK" >/dev/null 2>&1 || docker network create "$DHOLE_NETWORK"
          test -r "$DHOLE_ENV_FILE"

          OLLAMA_ID="$(docker ps -q --filter name=^/ollama$ | head -n1 || true)"
          if [[ -z "$OLLAMA_ID" ]]; then
            OLLAMA_ID="$(docker ps -q --filter label=com.docker.compose.service=ollama | head -n1 || true)"
          fi
          if [[ -z "$OLLAMA_ID" ]]; then
            echo "Ollama container not found. Hermes requires local Ollama." >&2
            exit 1
          fi

          docker network connect --alias ollama "$DHOLE_NETWORK" "$OLLAMA_ID" 2>/dev/null || true

          ensure_docker_image() {
            local image="$1"
            if docker image inspect "$image" >/dev/null 2>&1; then
              return 0
            fi

            for attempt in $(seq 1 5); do
              if docker pull "$image"; then
                return 0
              fi

              if [ "$attempt" -eq 5 ]; then
                echo "Unable to pull required Docker image: $image" >&2
                return 1
              fi

              echo "Pull failed for $image (attempt $attempt/5). Retrying..."
              sleep $((attempt * 5))
            done
          }

          # DholeSystem uses this image for the one-shot Hermes config initializer.
          # The Hermes compose command intentionally uses --pull never for the locally
          # built Hermes image, so preload Alpine explicitly when the runner cache is empty.
          ensure_docker_image alpine:3.20

          docker build --pull             -f .dhole-system/deploy/hermes/Dockerfile             -t dhole/hermes-agent:latest             .dhole-system

          docker compose             --env-file "$DHOLE_ENV_FILE"             -f .dhole-system/deploy/docker-compose.infrastructure.yml             -p dhole-infrastructure             up -d --pull never hermes-config-init hermes-agent

          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 5 http://127.0.0.1:8642/health >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              HERMES_ID="$(docker compose --env-file "$DHOLE_ENV_FILE" -f .dhole-system/deploy/docker-compose.infrastructure.yml -p dhole-infrastructure ps -q hermes-agent)"
              if [ -n "$HERMES_ID" ]; then docker logs --tail 200 "$HERMES_ID" || true; fi
              exit 1
            fi
            sleep 3
          done

          HERMES_ID="$(docker compose --env-file "$DHOLE_ENV_FILE" -f .dhole-system/deploy/docker-compose.infrastructure.yml -p dhole-infrastructure ps -q hermes-agent)"
          test -n "$HERMES_ID"
          docker exec "$HERMES_ID" curl -fsS http://ollama:11434/v1/models >/dev/null
          docker exec "$HERMES_ID" test -x /usr/bin/chromium

          docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -p "$COMPOSE_PROJECT" config -q

      - name: Protect previous Agent images for rollback
        id: capture_images
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/maersk-phase8-image-rollback.sh capture production

      - name: Build Agent images
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA_TAG="${GITHUB_SHA::12}"

          # Stop before subsequent image builds if the first build consumed
          # unexpectedly high space. Protect running services and their data.
          check_build_headroom() {
            local available
            available="$(df -Pk / | awk 'NR==2 {print $4}')"
            if [ "$available" -lt $((2 * 1024 * 1024)) ]; then
              echo "Stopping Agent build: less than 2 GiB of root headroom remains." >&2
              exit 1
            fi
          }
          check_build_headroom

          docker build --pull             --target api-final             --build-arg GITHUB_ACTOR="$GITHUB_ACTOR"             --secret id=github_token,env=GITHUB_TOKEN             -t dhole/agent-api:latest             -t "dhole/agent-api:$SHA_TAG"             .

          check_build_headroom

          docker build --pull             --target worker-final             --build-arg GITHUB_ACTOR="$GITHUB_ACTOR"             --secret id=github_token,env=GITHUB_TOKEN             -t dhole/agent-workers:latest             -t "dhole/agent-workers:$SHA_TAG"             .

      - name: Mark phase 8 deployment started
        shell: bash
        run: bash scripts/maersk-phase8-image-rollback.sh mark-deploy production

      - name: Deploy Agent API production
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -p "$COMPOSE_PROJECT" \
            up -d --no-deps --force-recreate --pull never dhole-agent-api

      - name: Verify Agent API
        shell: bash
        run: |
          set -euo pipefail
          CONTAINER_ID="$(docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -p "$COMPOSE_PROJECT" ps -q dhole-agent-api)"
          test -n "$CONTAINER_ID"
          for attempt in $(seq 1 60); do
            STATUS="$(docker inspect --format='{{.State.Status}}' "$CONTAINER_ID" 2>/dev/null || true)"
            if [ "$STATUS" = "exited" ] || [ "$STATUS" = "dead" ]; then
              docker logs --tail 200 "$CONTAINER_ID" || true
              exit 1
            fi
            if docker run --rm --network "$DHOLE_NETWORK" curlimages/curl:8.12.1 \
              --fail --silent --show-error --max-time 3 http://dhole-agent-api:8080/health >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs --tail 200 "$CONTAINER_ID" || true
              exit 1
            fi
            sleep 2
          done

      - name: Phase 8 verify migrated schema before workers
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/maersk-phase8-schema-check.sh production

      - name: Deploy Agent workers production
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -p "$COMPOSE_PROJECT" \
            up -d --no-deps --force-recreate --pull never dhole-agent-workers

      - name: Verify Agent worker queue pump
        shell: bash
        run: |
          set -euo pipefail
          CONTAINER_ID="$(docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -p "$COMPOSE_PROJECT" ps -q dhole-agent-workers)"
          test -n "$CONTAINER_ID"

          for attempt in $(seq 1 30); do
            STATUS="$(docker inspect --format='{{.State.Status}}' "$CONTAINER_ID" 2>/dev/null || true)"
            if [ "$STATUS" = "exited" ] || [ "$STATUS" = "dead" ]; then
              docker logs --tail 300 "$CONTAINER_ID" || true
              exit 1
            fi

            if docker logs --since 2m "$CONTAINER_ID" 2>&1 | grep -q 'AGENT_QUEUE_PUMP_STARTED'; then
              echo "Agent queue pump is running."
              docker logs --since 2m "$CONTAINER_ID" 2>&1 | grep -E 'AGENT_QUEUE_PUMP_(STARTED|HEARTBEAT)' | tail -n 20 || true
              exit 0
            fi

            sleep 2
          done

          echo "Agent worker is running but queue pump did not start." >&2
          docker logs --tail 300 "$CONTAINER_ID" || true
          exit 1

      - name: Restore previous Agent images on failed deployment
        if: ${{ failure() && steps.capture_images.outcome == 'success' }}
        shell: bash
        run: bash scripts/maersk-phase8-image-rollback.sh restore production

      - name: Cleanup Docker build cache
        if: always()
        shell: bash
        run: |
          docker builder prune -af || true
          docker image prune -f || true
          df -h / || true
