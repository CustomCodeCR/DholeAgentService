name: Deploy Dhole Agent - Staging

on:
  # Explicit worker hotfix rollout: deploy validated request-queue drain,
  # manual dispatch fix, and stale-event protection; preserve backup gates.
  # Redeploy after the repository Actions secret GENERATION_ORCHESTRATOR_GITHUB_TOKEN
  # was configured by the administrator. Retain existing protected release gates.
  # Release data-quality trigger acceptance through the same protected
  # staging and production promotion without weakening any authentication gate.
  # Final production-gated release: includes post-failure GitHub dispatch
  # cooldown and safe re-submission of infrastructure provisioning requests.
  # Final validated orchestration release: includes arbitrary prodN safe return
  # and dispatch/deadline correctness fixes. Preserve every profile volume.
  # Authorized runtime orchestration release: DB-to-GitHub Worker dispatch,
  # safe operational rules, protected runner handoff and readiness checks.
  # The original database backup, queue drain and rollback stay mandatory.
  # Protected staging retry after bounded Agent task drain (570 seconds).
  # Authorized 2026-10-11 deployment of validated dynamic prodN control-plane.
  # Keep existing persistent profiles, backups, drain and rollback unchanged.
  # Protected Agent control-plane release: includes authenticated generation
  # read/rules/request endpoints and read-only Worker generation observation.
  # Keep phase-8 backups, schema checks and rollback unchanged.
  # Production-generation orchestrator release (2026-10-11):
  # final protected retry after passing Python generation-suite fixes and
  # publishing the dormant standby provisioning workflow on both branches.
  # explicitly trigger one guarded staging deployment for the current develop SHA.
  # Do not remove the database backup, schema gate, queue drain or rollback.
  # Release promotion retry: pin the already validated staging runtime to the
  # current develop commit before master production promotion.
  # Authorized release: Worker standby-readiness DB gate after verified prod1 attestation.
  # Preserve protected backups, schema gates, worker drain and rollback on both environments.
  # Authorized 2026-10-12 retry-safe Npgsql hotfix; deploy staged Agent API and
  # Worker before the generation-aware prod1 release. Keep full snapshot gates.
  # Only this workflow's explicitly authorized YAML change triggers the
  # guarded staging deploy; ordinary develop pushes remain validation-only.
  push:
    branches: [develop]
    paths:
      - .github/workflows/deploy-staging.yml
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_AGENT_STAGING to authorize this release"
        type: string
        required: true
      backup_dir:
        description: "Absolute path to verified backups on the self-hosted runner"
        type: string
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  group: dhole-agent-staging
  cancel-in-progress: false

env:
  COMPOSE_FILE: .dhole-system/deploy/docker-compose.services.yml
  COMPOSE_OVERRIDE: .dhole-system/deploy/docker-compose.staging.yml
  DHOLE_IMAGE_TAG: staging
  DHOLE_NETWORK: dhole-staging
  COMPOSE_PROJECT: dhole-staging

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Checkout Agent
        uses: actions/checkout@v4

      - name: Confirm phase 8 manual release
        shell: bash
        env:
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == push ]]; then
            [[ "${{ github.ref }}" == refs/heads/develop ]] ||
              { echo "Not the explicitly requested develop deployment" >&2; exit 1; }
          else
            [[ "$RELEASE_CONFIRMATION" == "DEPLOY_AGENT_STAGING" ]] || { echo "Explicit release confirmation required" >&2; exit 1; }
          fi

      - name: Load Dhole staging infrastructure
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .dhole-system
          for attempt in $(seq 1 5); do
            if git clone --depth 1 --branch develop https://github.com/CustomCodeCR/DholeSystem.git .dhole-system; then
              break
            fi

            rm -rf .dhole-system
            if [ "$attempt" -eq 5 ]; then
              echo "Unable to clone DholeSystem after 5 attempts. Check DNS/network access to github.com." >&2
              exit 1
            fi

            echo "DholeSystem clone failed (attempt $attempt/5). Retrying..."
            sleep $((attempt * 5))
          done
          mkdir -p "$RUNNER_TEMP/dhole-env"
          bash .dhole-system/deploy/prepare-environments.sh /opt/dhole/.env "$RUNNER_TEMP/dhole-env"
          echo "AGENT_NOVNC_HOST_PORT=6081" >> "$RUNNER_TEMP/dhole-env/.env.staging"
          echo "DHOLE_ENV_FILE=$RUNNER_TEMP/dhole-env/.env.staging" >> "$GITHUB_ENV"

      - name: Require enabled Maersk circuit and monitoring
        shell: bash
        run: |
          set -euo pipefail
          for key in MaerskCircuit__Enabled MaerskMonitoring__Enabled; do
            grep -Fxq "$key=true" "$DHOLE_ENV_FILE" || {
              echo "Protected release requires $key=true in the prepared runtime config." >&2
              exit 1
            }
          done

      - name: Automated protected staging backup
        if: ${{ github.event_name == 'push' }}
        id: automatic_backup
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/maersk-one-shot-deployment-snapshot.sh
          bash scripts/maersk-one-shot-deployment-snapshot.sh staging \
            .dhole-system "$HOME/dhole-agent-protected-release-backups"

      - name: Phase 8 verify database and profile/key backups
        shell: bash
        env:
          PHASE8_BACKUP_DIR: ${{ github.event_name == 'push' && steps.automatic_backup.outputs.backup_dir || inputs.backup_dir }}
        run: |
          set -euo pipefail
          # Only existing verified active rollouts may keep flags on during
          # future protected deployments; preflight still checks backups,
          # checksum, restored schema and both flags.
          export MAERSK_PHASE2_ACTIVE_REDEPLOY=CONFIRMED
          bash scripts/maersk-phase8-preflight.sh staging "$PHASE8_BACKUP_DIR" "$DHOLE_ENV_FILE"

      - name: Ensure Agent database exists
        shell: bash
        run: |
          set -euo pipefail
          test -r "$DHOLE_ENV_FILE"

          AGENT_CONNECTION="$(grep -m1 '^AGENT_POSTGRES_CONNECTION_STRING=' "$DHOLE_ENV_FILE" | cut -d= -f2-)"
          if [ -z "$AGENT_CONNECTION" ]; then
            echo "AGENT_POSTGRES_CONNECTION_STRING is missing from $DHOLE_ENV_FILE" >&2
            exit 1
          fi

          connection_value() {
            printf '%s' "$AGENT_CONNECTION" | tr ';' '\n' | sed -n "s/^$1=//p" | head -n1
          }

          DB_HOST="$(connection_value Host)"
          DB_PORT="$(connection_value Port)"
          DB_NAME="$(connection_value Database)"
          DB_USER="$(connection_value Username)"
          DB_PASSWORD="$(connection_value Password)"

          DB_HOST="${DB_HOST:-postgres}"
          DB_PORT="${DB_PORT:-5432}"

          if ! [[ "$DB_NAME" =~ ^[A-Za-z0-9_]+$ ]]; then
            echo "Unsafe or empty Agent database name: $DB_NAME" >&2
            exit 1
          fi
          if [ -z "$DB_USER" ] || [ -z "$DB_PASSWORD" ]; then
            echo "Agent database username/password are missing." >&2
            exit 1
          fi

          for attempt in $(seq 1 30); do
            if docker run --rm --network "$DHOLE_NETWORK" \
              -e PGPASSWORD="$DB_PASSWORD" \
              postgres:16-alpine \
              pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d postgres >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "PostgreSQL is not reachable from network $DHOLE_NETWORK." >&2
              exit 1
            fi
            sleep 2
          done

          EXISTS="$(docker run --rm --network "$DHOLE_NETWORK" \
            -e PGPASSWORD="$DB_PASSWORD" \
            postgres:16-alpine \
            psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$DB_NAME'")"

          if [ "$EXISTS" != "1" ]; then
            docker run --rm --network "$DHOLE_NETWORK" \
              -e PGPASSWORD="$DB_PASSWORD" \
              postgres:16-alpine \
              createdb -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" "$DB_NAME"
            echo "Created Agent database: $DB_NAME"
          else
            echo "Agent database already exists: $DB_NAME"
          fi

      - name: Ensure local Ollama and staging Hermes
        shell: bash
        run: |
          set -euo pipefail
          docker network inspect "$DHOLE_NETWORK" >/dev/null 2>&1 || docker network create "$DHOLE_NETWORK"
          test -r "$DHOLE_ENV_FILE"

          OLLAMA_ID="$(docker ps -q --filter name=^/ollama$ | head -n1 || true)"
          if [[ -z "$OLLAMA_ID" ]]; then
            OLLAMA_ID="$(docker ps -q --filter label=com.docker.compose.service=ollama | head -n1 || true)"
          fi
          if [[ -z "$OLLAMA_ID" ]]; then
            echo "Ollama container not found. Hermes requires local Ollama." >&2
            exit 1
          fi

          docker network connect --alias ollama "$DHOLE_NETWORK" "$OLLAMA_ID" 2>/dev/null || true

          ensure_docker_image() {
            local image="$1"
            if docker image inspect "$image" >/dev/null 2>&1; then
              return 0
            fi

            for attempt in $(seq 1 5); do
              if docker pull "$image"; then
                return 0
              fi

              if [ "$attempt" -eq 5 ]; then
                echo "Unable to pull required Docker image: $image" >&2
                return 1
              fi

              echo "Pull failed for $image (attempt $attempt/5). Retrying..."
              sleep $((attempt * 5))
            done
          }

          # DholeSystem uses this image for the one-shot Hermes config initializer.
          # The Hermes compose command intentionally uses --pull never for the locally
          # built Hermes image, so preload Alpine explicitly when the runner cache is empty.
          ensure_docker_image alpine:3.20

          docker build --pull             -f .dhole-system/deploy/hermes/Dockerfile             -t dhole/hermes-agent:staging             .dhole-system

          docker compose             --env-file "$DHOLE_ENV_FILE"             -f .dhole-system/deploy/docker-compose.staging-infra.yml             -p dhole-staging-infra             up -d --pull never hermes-config-init-staging hermes-agent-staging

          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 5 http://127.0.0.1:18642/health >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              HERMES_ID="$(docker compose --env-file "$DHOLE_ENV_FILE" -f .dhole-system/deploy/docker-compose.staging-infra.yml -p dhole-staging-infra ps -q hermes-agent-staging)"
              if [ -n "$HERMES_ID" ]; then docker logs --tail 200 "$HERMES_ID" || true; fi
              exit 1
            fi
            sleep 3
          done

          HERMES_ID="$(docker compose --env-file "$DHOLE_ENV_FILE" -f .dhole-system/deploy/docker-compose.staging-infra.yml -p dhole-staging-infra ps -q hermes-agent-staging)"
          test -n "$HERMES_ID"
          docker exec "$HERMES_ID" curl -fsS http://ollama:11434/v1/models >/dev/null
          docker exec "$HERMES_ID" test -x /usr/bin/chromium

          docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -f "$COMPOSE_OVERRIDE" -p "$COMPOSE_PROJECT" config -q

      - name: Protect previous Agent images for rollback
        id: capture_images
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/maersk-phase8-image-rollback.sh capture staging

      - name: Build Agent images
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA_TAG="${GITHUB_SHA::12}"

          docker build --pull             --target api-final             --build-arg GITHUB_ACTOR="$GITHUB_ACTOR"             --secret id=github_token,env=GITHUB_TOKEN             -t dhole/agent-api:staging             -t "dhole/agent-api:staging-$SHA_TAG"             .

          docker build --pull             --target worker-final             --build-arg GITHUB_ACTOR="$GITHUB_ACTOR"             --secret id=github_token,env=GITHUB_TOKEN             -t dhole/agent-workers:staging             -t "dhole/agent-workers:staging-$SHA_TAG"             .

      - name: Mark phase 8 deployment started
        shell: bash
        run: bash scripts/maersk-phase8-image-rollback.sh mark-deploy staging

      - name: Deploy Agent API staging
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -f "$COMPOSE_OVERRIDE" -p "$COMPOSE_PROJECT" \
            up -d --no-deps --force-recreate --pull never dhole-agent-api

      - name: Verify Agent API
        shell: bash
        run: |
          set -euo pipefail
          CONTAINER_ID="$(docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -f "$COMPOSE_OVERRIDE" -p "$COMPOSE_PROJECT" ps -q dhole-agent-api)"
          test -n "$CONTAINER_ID"
          for attempt in $(seq 1 60); do
            STATUS="$(docker inspect --format='{{.State.Status}}' "$CONTAINER_ID" 2>/dev/null || true)"
            if [ "$STATUS" = "exited" ] || [ "$STATUS" = "dead" ]; then
              docker logs --tail 200 "$CONTAINER_ID" || true
              exit 1
            fi
            if docker run --rm --network "$DHOLE_NETWORK" curlimages/curl:8.12.1 \
              --fail --silent --show-error --max-time 3 http://dhole-agent-api:8080/health >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs --tail 200 "$CONTAINER_ID" || true
              exit 1
            fi
            sleep 2
          done

      - name: Phase 8 verify migrated schema before workers
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/maersk-phase8-schema-check.sh staging

      - name: Deploy Agent workers staging
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -f "$COMPOSE_OVERRIDE" -p "$COMPOSE_PROJECT" \
            up -d --no-deps --force-recreate --pull never dhole-agent-workers

      - name: Verify Agent worker queue pump
        shell: bash
        run: |
          set -euo pipefail
          CONTAINER_ID="$(docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -f "$COMPOSE_OVERRIDE" -p "$COMPOSE_PROJECT" ps -q dhole-agent-workers)"
          test -n "$CONTAINER_ID"

          for attempt in $(seq 1 30); do
            STATUS="$(docker inspect --format='{{.State.Status}}' "$CONTAINER_ID" 2>/dev/null || true)"
            if [ "$STATUS" = "exited" ] || [ "$STATUS" = "dead" ]; then
              docker logs --tail 300 "$CONTAINER_ID" || true
              exit 1
            fi

            if docker logs --since 2m "$CONTAINER_ID" 2>&1 | grep -Eq 'AGENT_QUEUE_(PUMP|CONCURRENT)_STARTED'; then
              echo "Agent queue dispatcher is running."
              docker logs --since 2m "$CONTAINER_ID" 2>&1 | grep -E 'AGENT_QUEUE_(PUMP_(STARTED|HEARTBEAT)|CONCURRENT_STARTED)' | tail -n 20 || true
              exit 0
            fi

            sleep 2
          done

          echo "Agent worker is running but queue pump did not start." >&2
          docker logs --tail 300 "$CONTAINER_ID" || true
          exit 1

      - name: Resume original staging Worker if guarded deploy failed
        if: ${{ failure() && github.event_name == 'push' && steps.automatic_backup.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          id="$(docker ps -aq --filter label=com.docker.compose.project=dhole-staging --filter label=com.docker.compose.service=dhole-agent-workers)"
          test -n "$id"
          if [[ "$(docker inspect --format '{{.State.Status}}' "$id")" != running ]]; then
            docker start "$id"
          fi

      - name: Restore previous Agent images on failed deployment
        if: ${{ failure() && steps.capture_images.outcome == 'success' }}
        shell: bash
        run: bash scripts/maersk-phase8-image-rollback.sh restore staging

      - name: Cleanup old images
        if: always()
        run: docker image prune -f
