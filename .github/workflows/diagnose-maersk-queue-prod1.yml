name: Diagnose stalled Maersk queue (read-only)
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/diagnose-maersk-queue-prod1.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dhole-agent-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, dhole]
    timeout-minutes: 5
    steps:
      - name: Inspect current Workers, circuit and queued execution without changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess,os,re,datetime
          TARGET="12a4b7d3-9ee4-477a-a191-731a0eff7912"
          PROVIDER="2155f49f-ef15-43a5-9cc1-55203598af59"
          def run(args,**kwargs):
              return subprocess.run(args,check=True,capture_output=True,text=True,timeout=60,**kwargs).stdout.strip()
          ids=run(["docker","ps","-aq","--filter","label=com.docker.compose.project"]).splitlines()
          containers=[]
          for id in ids:
              info=json.loads(run(["docker","inspect",id]))[0]
              labels=info.get("Config",{}).get("Labels",{})
              proj=labels.get("com.docker.compose.project","")
              svc=labels.get("com.docker.compose.service","")
              if (proj=="dhole" and svc in ("dhole-agent-api","dhole-agent-workers")) or (proj=="dhole-agent-prod1" and svc in ("dhole-agent-workers-prod1","dhole-agent-api-prod1")):
                  containers.append((proj,svc,info))
                  print("MAERSK_DIAG_CONTAINER",proj,svc,"state="+info.get("State",{}).get("Status","unknown"),"image="+info.get("Image","")[:19],"restart_count="+str(info.get("RestartCount","?")))
          workers=[i for p,s,i in containers if "workers" in s and i.get("State",{}).get("Status")=="running"]
          print("MAERSK_DIAG_ACTIVE_WORKER_COUNT",len(workers))
          if len(workers)!=1:
              print("MAERSK_DIAG_OWNER_ALERT unexpected Worker count")
          for worker in workers:
              env=dict(item.split("=",1) for item in worker["Config"].get("Env",[]) if "=" in item)
              for key in ("AgentQueue__ConcurrentDispatcherEnabled","AgentQueue__MaxConcurrentExecutions","AgentQueue__MaxConcurrentMaersk","AgentQueue__PollIntervalSeconds","MaerskCircuit__Enabled","MaerskMonitoring__Enabled"):
                  value=env.get(key,"not_set")
                  if value=="not_set" or re.fullmatch(r"(true|false|[0-9]{1,6})",value,re.IGNORECASE):
                      print("MAERSK_DIAG_WORKER_CONFIG",key,value)
              output=subprocess.run(["docker","logs","--since","75m",worker["Id"]],capture_output=True,text=True,timeout=60)
              log=output.stdout+"\n"+output.stderr
              for term in ("AGENT_QUEUE_CONCURRENT_STARTED","AGENT_QUEUE_PUMP_STARTED","AGENT_QUEUE_DISPATCH_ERROR","AGENT_QUEUE_CLAIMED","AGENT_QUEUE_JOB_FAILED","AGENT_QUEUE_EXECUTION_ERROR","AGENT_QUEUE_RECONCILED","MAERSK_CIRCUIT","AGENT_QUEUE_TRANSIENT_BACKOFF"):
                  print("MAERSK_DIAG_WORKER_EVENT",term,"count="+str(log.count(term)),"target_mentions="+str(sum(1 for x in log.splitlines() if term in x and TARGET in x)))
              exceptions={}
              for value in re.findall(r"\b(?:System|Npgsql|Microsoft|Dhole)[\w.]*Exception\b",log):
                  exceptions[value]=exceptions.get(value,0)+1
              for value,count in sorted(exceptions.items(),key=lambda x:-x[1])[:7]:
                  print("MAERSK_DIAG_WORKER_EXCEPTION",value,count)
          source=next((i for p,s,i in containers if p=="dhole" and s=="dhole-agent-api" and i.get("State",{}).get("Status")=="running"),None)
          if source is None:
              print("MAERSK_DIAG_DATABASE_UNAVAILABLE: no active primary API")
              raise SystemExit(1)
          values=dict(item.split("=",1) for item in source["Config"].get("Env",[]) if "=" in item)
          conn=values.get("Postgres__ConnectionString") or values.get("AGENT_POSTGRES_CONNECTION_STRING")
          if not conn:
              print("MAERSK_DIAG_DATABASE_UNAVAILABLE: missing configured DB key")
              raise SystemExit(1)
          db=dict(part.split("=",1) for part in conn.split(";") if "=" in part)
          for key in ("Database","Username","Password"):
              if not db.get(key):
                  print("MAERSK_DIAG_DATABASE_UNAVAILABLE missing",key)
                  raise SystemExit(1)
          def query(label,sql):
              childenv=os.environ.copy()
              childenv["PGPASSWORD"]=db["Password"]
              childenv["PGOPTIONS"]="-c default_transaction_read_only=on"
              args=["docker","run","--rm","--pull","never","--network","dhole","-e","PGPASSWORD","-e","PGOPTIONS","postgres:17-alpine","psql","-X","-A","-t","-F","|","-v","ON_ERROR_STOP=1","-h",db.get("Host","postgres"),"-p",db.get("Port","5432"),"-U",db["Username"],"-d",db["Database"],"-c",sql]
              result=subprocess.run(args,env=childenv,capture_output=True,text=True,timeout=55)
              if result.returncode!=0:
                  print("MAERSK_DIAG_QUERY_UNAVAILABLE",label,"returncode="+str(result.returncode))
                  return
              for line in result.stdout.splitlines()[:20]:
                  if len(line)<250 and re.fullmatch(r"[A-Za-z0-9_\-:.+|/ ]+",line):
                      print("MAERSK_DIAG_DB",label,line)
          query("target",f"""SELECT status,attempt,max_attempts,coalesce(to_char(created_at_utc at time zone 'UTC','YYYY-MM-DD HH24:MI:SS'),'none'),coalesce(to_char(started_at at time zone 'UTC','YYYY-MM-DD HH24:MI:SS'),'none'),coalesce(to_char(next_attempt_at_utc at time zone 'UTC','YYYY-MM-DD HH24:MI:SS'),'none'),coalesce(error_code,'none') FROM agent."AgentExecutions" WHERE id='{TARGET}'""")
          query("circuit",f"""SELECT state,requires_operator,coalesce(reason_code,'none'),consecutive_failures,coalesce(to_char(open_until_utc at time zone 'UTC','YYYY-MM-DD HH24:MI:SS'),'none') FROM agent.maersk_circuits WHERE provider_id='{PROVIDER}'""")
          query("recent_maersk",f"""SELECT status,coalesce(error_code,'none'),count(*) FROM agent."AgentExecutions" WHERE provider_id='{PROVIDER}' AND created_at_utc > now()-interval '3 hours' GROUP BY status,error_code ORDER BY count(*) DESC LIMIT 16""")
          query("lease",f"""SELECT lease_scope,coalesce(to_char(expires_at_utc at time zone 'UTC','YYYY-MM-DD HH24:MI:SS'),'none'),coalesce(to_char(heartbeat_at_utc at time zone 'UTC','YYYY-MM-DD HH24:MI:SS'),'none') FROM agent.execution_leases WHERE execution_id='{TARGET}' OR lease_scope='maersk:{PROVIDER.replace("-","")}' LIMIT 5""")
          query("running",f"""SELECT count(*) FROM agent."AgentExecutions" WHERE provider_id='{PROVIDER}' AND status='Running'""")
          print("MAERSK_DIAG_FINISHED_READ_ONLY")
          PY