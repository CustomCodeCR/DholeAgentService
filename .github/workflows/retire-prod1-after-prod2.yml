name: Remove retired prod1 after verified prod2 handoff

# Destructive retirement is manual. Pushes never erase browser sessions.
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Verify resources or irreversibly remove retired prod1
        required: true
        default: check
        options: [check, apply]
      confirmation:
        type: string
        description: For apply type DELETE_RETIRED_GENERATION_DATA
        required: false

permissions:
  contents: read

concurrency:
  group: dhole-agent-production
  cancel-in-progress: false

jobs:
  retire:
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: [self-hosted, linux, x64, dhole]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Prepare protected environment
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch master https://github.com/CustomCodeCR/DholeSystem.git .dhole-system
          mkdir -p "$RUNNER_TEMP/retire-prod1"
          chmod 700 "$RUNNER_TEMP/retire-prod1"
          bash .dhole-system/deploy/prepare-environments.sh /opt/dhole/.env "$RUNNER_TEMP/retire-prod1" >/dev/null
          chmod 600 "$RUNNER_TEMP/retire-prod1/.env.production"
      - name: Check or retire historical prod1 (does not touch prod2)
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          args=(prod1 --env-file "$RUNNER_TEMP/retire-prod1/.env.production")
          if [[ "$MODE" == apply ]]; then
            [[ "$CONFIRMATION" == DELETE_RETIRED_GENERATION_DATA ]] || exit 2
            args+=(--apply --confirmation "$CONFIRMATION")
          fi
          python3 scripts/retire-production-generation.py "${args[@]}"
