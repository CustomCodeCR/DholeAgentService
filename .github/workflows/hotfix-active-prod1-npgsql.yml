name: Hotfix active prod1 Npgsql transactions
on:
  workflow_run:
    workflows: ["Deploy Dhole Agent - Staging"]
    branches: [develop]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: dhole-agent-production
  cancel-in-progress: false

jobs:
  deploy-prod1:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'develop' && github.event.workflow_run.head_sha == '655201501ac9a9bcfa27c7f9191da3f95f35739c' }}
    runs-on: [self-hosted, linux, x64, dhole]
    timeout-minutes: 25
    steps:
      - name: Checkout reviewed protected prod1 hotfix
        uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false

      - name: Validate exact successful staged revision and script integrity
        shell: bash
        env:
          STAGING_SHA: ${{ github.event.workflow_run.head_sha }}
          STAGING_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$STAGING_SHA" == 655201501ac9a9bcfa27c7f9191da3f95f35739c ]] || exit 2
          [[ "$STAGING_RUN_ID" =~ ^[0-9]+$ ]] || exit 2
          response="$(curl -fsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/CustomCodeCR/DholeAgentService/actions/runs/$STAGING_RUN_ID")"
          printf '%s' "$response" | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          assert data["status"]=="completed" and data["conclusion"]=="success"
          assert data["head_sha"]=="655201501ac9a9bcfa27c7f9191da3f95f35739c"
          assert data["head_branch"]=="develop" and data["event"]=="push"
          assert data["name"]=="Deploy Dhole Agent - Staging"
          '
          bash -n scripts/deploy-active-prod1-npgsql-hotfix.sh
          bash -n scripts/maersk-phase8-backup.sh
          python3 -m py_compile scripts/production-generation-executor.py scripts/production-generation-apply-request.py
          echo 'PROD1_HOTFIX_VALIDATED_SUCCESSFUL_STAGING'

      - name: Prepare protected production runtime
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch master https://github.com/CustomCodeCR/DholeSystem.git .dhole-system
          mkdir -p "$RUNNER_TEMP/npgsql-prod1"
          chmod 700 "$RUNNER_TEMP/npgsql-prod1"
          bash .dhole-system/deploy/prepare-environments.sh \
            /opt/dhole/.env "$RUNNER_TEMP/npgsql-prod1" >/dev/null
          chmod 600 "$RUNNER_TEMP/npgsql-prod1/.env.production"
          echo "PROD1_HOTFIX_ENV=$RUNNER_TEMP/npgsql-prod1/.env.production" >> "$GITHUB_ENV"

      - name: Backup active prod1 and publish validated Npgsql Worker
        shell: bash
        env:
          STAGING_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          bash scripts/deploy-active-prod1-npgsql-hotfix.sh \
            "$STAGING_SHA" .dhole-system "$PROD1_HOTFIX_ENV" \
            "$HOME/dhole-agent-protected-release-backups"
