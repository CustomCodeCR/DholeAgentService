name: Standby Maersk authentication (browser-only)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "prepare, inspect signed-in account, restart viewer, or finish verified authorization"
        required: true
        type: choice
        options: [prepare, inspect, restart, finish]
      generation:
        description: "Pre-provisioned standby generation, never the active owner"
        required: true
        type: string
      credential_id:
        description: "Authorized active Maersk credential UUID, not a secret"
        required: true
        type: string
      confirmation:
        description: "Exact explicit confirmation, issued by authorized Agent API"
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: dhole-agent-production
  cancel-in-progress: false

jobs:
  standby:
    runs-on: [self-hosted, linux, x64, dhole]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false

      - name: Validate generation, operator intent and trusted scripts
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          GENERATION: ${{ inputs.generation }}
          CREDENTIAL: ${{ inputs.credential_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          set +x
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == refs/heads/master ]] || exit 2
          [[ "$GENERATION" =~ ^prod([2-9]|[1-9][0-9]{1,2})$ ]] || exit 2
          [[ "${#GENERATION}" -le 7 ]] || exit 2
          [[ "$CREDENTIAL" =~ ^[a-f0-9]{32}$ ]] || exit 2
          case "$OPERATION" in
            prepare) [[ "$CONFIRMATION" == PREPARE_STANDBY_AUTHENTICATION ]] ;;
            inspect) [[ "$CONFIRMATION" == INSPECT_STANDBY_ACCOUNT ]] ;;
            restart) [[ "$CONFIRMATION" == RESTART_STANDBY_ACCOUNT_VIEWER ]] ;;
            finish) [[ "$CONFIRMATION" == I_INDEPENDENTLY_VERIFIED_AUTHORIZED_PROVIDER_ACCESS ]] ;;
            *) exit 2 ;;
          esac || exit 2
          python3 -m py_compile scripts/standby-authentication.py scripts/standby-auth-state.py
          bash -n docker/start-standby-auth.sh
          echo STANDBY_AUTH_INPUTS_VERIFIED

      - name: Prepare protected database connection
        shell: bash
        run: |
          set -euo pipefail
          set +x
          git clone --depth 1 --branch master https://github.com/CustomCodeCR/DholeSystem.git .dhole-system
          mkdir -p "$RUNNER_TEMP/standby-authentication"
          chmod 700 "$RUNNER_TEMP/standby-authentication"
          bash .dhole-system/deploy/prepare-environments.sh \
            /opt/dhole/.env "$RUNNER_TEMP/standby-authentication" >/dev/null
          chmod 600 "$RUNNER_TEMP/standby-authentication/.env.production"
          echo "GENERATION_PRIVATE_ENV=$RUNNER_TEMP/standby-authentication/.env.production" >> "$GITHUB_ENV"

      - name: Safely repair missing dormant standby Worker before browser preparation
        if: ${{ inputs.operation == 'prepare' }}
        shell: bash
        env:
          GENERATION: ${{ inputs.generation }}
        run: |
          set -euo pipefail
          # Existing guarded provisioning creates ONLY the missing dormant
          # Worker, preserves browser/key/Hermes volumes, and keeps the only
          # active queue Worker in its original generation.
          # The standby API is stateless and may be safely reconciled.
          bash scripts/provision-production-generation.sh \
            "$GENERATION" apply .dhole-system "$GENERATION_PRIVATE_ENV"
          echo "STANDBY_AUTH_DORMANT_WORKER_REPAIRED generation=$GENERATION"

      - name: Claim requested standby authentication
        if: ${{ inputs.operation == 'prepare' }}
        shell: bash
        env:
          GENERATION: ${{ inputs.generation }}
          CREDENTIAL: ${{ inputs.credential_id }}
        run: |
          set -euo pipefail
          python3 scripts/standby-auth-state.py --env-file "$GENERATION_PRIVATE_ENV" \
            --generation "$GENERATION" --credential "$CREDENTIAL" --status Preparing

      - name: Start isolated temporary Chromium and loopback-only noVNC
        if: ${{ inputs.operation == 'prepare' }}
        shell: bash
        env:
          GENERATION: ${{ inputs.generation }}
          CREDENTIAL: ${{ inputs.credential_id }}
        run: |
          set -euo pipefail
          python3 scripts/standby-authentication.py --operation prepare \
            --generation "$GENERATION" --credential "$CREDENTIAL"

      - name: Mark browser ready for manual login
        if: ${{ inputs.operation == 'prepare' }}
        shell: bash
        env:
          GENERATION: ${{ inputs.generation }}
          CREDENTIAL: ${{ inputs.credential_id }}
        run: |
          set -euo pipefail
          python3 scripts/standby-auth-state.py --env-file "$GENERATION_PRIVATE_ENV" \
            --generation "$GENERATION" --credential "$CREDENTIAL" --status Ready

      - name: Build patched standby Worker image without changing active prod1
        if: ${{ inputs.operation == 'restart' }}
        shell: bash
        env:
          # Prefer a dedicated read:packages credential when cross-repository
          # package access has not been granted to this workflow's GITHUB_TOKEN.
          # Neither credential is ever written to the image or logs.
          GITHUB_TOKEN: ${{ secrets.NUGET_PACKAGES_READ_TOKEN || github.token }}
          NUGET_PACKAGE_USER: ${{ vars.NUGET_PACKAGES_ACTOR || github.actor }}
        run: |
          set -euo pipefail
          set +x
          [[ -n "$GITHUB_TOKEN" && -n "$NUGET_PACKAGE_USER" ]] || {
            echo "STANDBY_NUGET_CREDENTIAL_MISSING" >&2
            exit 2
          }
          # Fail clearly before an expensive image build. A 403 means the
          # package owner must grant Actions access to this repository or a
          # dedicated read:packages token must be configured.
          # Pass credentials over stdin rather than exposing the token in the
          # curl process command line on the shared self-hosted runner.
          status="$(printf 'user = "%s:%s"\n' "$NUGET_PACKAGE_USER" "$GITHUB_TOKEN" | \
            curl --config - --silent --show-error --max-time 20 \
              --output /dev/null --write-out '%{http_code}' \
              "https://nuget.pkg.github.com/CustomCodeCR/download/customcodeframework.core/index.json")"
          if [[ "$status" != 200 ]]; then
            echo "STANDBY_NUGET_PACKAGE_ACCESS_REFUSED http_status=$status" >&2
            echo "Grant DholeAgentService Actions access to CustomCodeFramework packages, or set NUGET_PACKAGES_READ_TOKEN (read:packages) and NUGET_PACKAGES_ACTOR." >&2
            exit 2
          fi
          tag="standby-inspector-$(git rev-parse --short=12 HEAD)"
          docker build --target worker-final \
            --build-arg "GITHUB_ACTOR=$NUGET_PACKAGE_USER" \
            --secret id=github_token,env=GITHUB_TOKEN \
            -t "dhole/agent-workers:$tag" .
          echo "STANDBY_AUTH_IMAGE=dhole/agent-workers:$tag" >> "$GITHUB_ENV"

      - name: Restart only the isolated Chromium viewer with local CDP
        if: ${{ inputs.operation == 'restart' }}
        shell: bash
        env:
          GENERATION: ${{ inputs.generation }}
          CREDENTIAL: ${{ inputs.credential_id }}
        run: |
          set -euo pipefail
          python3 scripts/standby-authentication.py --operation restart \
            --generation "$GENERATION" --credential "$CREDENTIAL"

      - name: Mark restarted viewer ready
        if: ${{ inputs.operation == 'restart' }}
        shell: bash
        env:
          GENERATION: ${{ inputs.generation }}
          CREDENTIAL: ${{ inputs.credential_id }}
        run: |
          set -euo pipefail
          python3 scripts/standby-auth-state.py --env-file "$GENERATION_PRIVATE_ENV" \
            --generation "$GENERATION" --credential "$CREDENTIAL" --status Ready --restart-ready

      - name: Read actual authenticated account before inspection or closure
        if: ${{ inputs.operation == 'inspect' || inputs.operation == 'finish' }}
        shell: bash
        env:
          GENERATION: ${{ inputs.generation }}
          CREDENTIAL: ${{ inputs.credential_id }}
        run: |
          set -euo pipefail
          umask 077
          identity_file="$RUNNER_TEMP/standby-authentication/verified-identity.json"
          python3 scripts/standby-authentication.py --operation inspect \
            --generation "$GENERATION" --credential "$CREDENTIAL" \
            --identity-output "$identity_file"
          python3 scripts/standby-auth-state.py --env-file "$GENERATION_PRIVATE_ENV" \
            --generation "$GENERATION" --credential "$CREDENTIAL" \
            --identity-file "$identity_file"
          rm -f "$identity_file"
          echo STANDBY_MAERSK_ACCOUNT_PROOF_RECORDED

      - name: Close only standby viewer; preserve persistent browser profile
        if: ${{ inputs.operation == 'finish' }}
        shell: bash
        env:
          GENERATION: ${{ inputs.generation }}
          CREDENTIAL: ${{ inputs.credential_id }}
        run: |
          set -euo pipefail
          python3 scripts/standby-authentication.py --operation finish \
            --generation "$GENERATION" --credential "$CREDENTIAL"

      - name: Require independent provider authorization and technical readiness
        if: ${{ inputs.operation == 'finish' }}
        shell: bash
        env:
          GENERATION: ${{ inputs.generation }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          python3 scripts/operator-attest-generation-readiness.py \
            --generation "$GENERATION" --confirmation "$CONFIRMATION" \
            --env-file "$GENERATION_PRIVATE_ENV" \
            --state-dir "$HOME/.local/state/dhole-production-generation"
          echo STANDBY_AUTH_ATTESTED_WORKER_REMAINS_STOPPED

      - name: Mark standby independently verified
        if: ${{ inputs.operation == 'finish' }}
        shell: bash
        env:
          GENERATION: ${{ inputs.generation }}
          CREDENTIAL: ${{ inputs.credential_id }}
        run: |
          set -euo pipefail
          python3 scripts/standby-auth-state.py --env-file "$GENERATION_PRIVATE_ENV" \
            --generation "$GENERATION" --credential "$CREDENTIAL" --status Verified

      - name: Remove private transient account evidence from runner
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          identity_file="$RUNNER_TEMP/standby-authentication/verified-identity.json"
          [[ ! -L "$identity_file" ]] || exit 2
          rm -f -- "$identity_file"

      - name: Record safe failure for operator
        if: ${{ failure() && inputs.operation != 'inspect' && env.GENERATION_PRIVATE_ENV != '' }}
        continue-on-error: true
        shell: bash
        env:
          GENERATION: ${{ inputs.generation }}
          CREDENTIAL: ${{ inputs.credential_id }}
        run: |
          set +e
          python3 scripts/standby-auth-state.py --env-file "$GENERATION_PRIVATE_ENV" \
            --generation "$GENERATION" --credential "$CREDENTIAL" --status Failed
          echo STANDBY_AUTH_OPERATOR_ATTENTION_REQUIRED
