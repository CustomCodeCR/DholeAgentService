name: Diagnose Maersk circuit reset 500 (read-only)
on:
  push:
    branches: [master]
    paths: [.github/workflows/diagnose-maersk-reset-500.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dhole-agent-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, dhole]
    timeout-minutes: 5
    steps:
      - name: Diagnose only exception type, stack and provider state without changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess,json,re,os,sys
          PROVIDER="2155f49f-ef15-43a5-9cc1-55203598af59"
          MARKERS=("0HNP81I5M5H1H","0HNP660QNPSCD","ResetByOperatorAsync","/maersk-circuit/","maersk-circuit","PostgresMaerskCircuitBreaker")
          def command(args,**kw):
              return subprocess.run(args,capture_output=True,text=True,timeout=45,**kw)
          rows={}
          for project,service in (("dhole","dhole-agent-api"),("dhole-agent-prod1","dhole-agent-api-prod1"),("dhole-agent-prod1","dhole-agent-workers-prod1")):
              id=command(["docker","ps","-aq","--filter",f"label=com.docker.compose.project={project}","--filter",f"label=com.docker.compose.service={service}"]).stdout.strip().splitlines()
              if len(id)!=1: print("RESET_DIAG_CONTAINER",project,service,"count="+str(len(id)));continue
              container=json.loads(command(["docker","inspect",id[0]]).stdout)[0]
              rows[(project,service)]=container
              print("RESET_DIAG_CONTAINER",project,service,"status="+container["State"]["Status"])
              out=command(["docker","logs","--since","90m",id[0]])
              lines=(out.stdout+"\n"+out.stderr).splitlines()
              exact=[i for i,line in enumerate(lines) if any(marker in line for marker in MARKERS)]
              print("RESET_DIAG_MATCHES",project,service,len(exact))
              for at in exact[-15:]:
                  # Print only non-sensitive exception class, SQLSTATE, and method signatures.
                  start=max(0,at-5);end=min(len(lines),at+38)
                  sample=lines[start:end]
                  found_types=set()
                  for line in sample:
                      for exc in re.findall(r"(?:System|Npgsql|Microsoft|Dhole|CustomCodeFramework)[.][\w.]*Exception",line):
                          if len(exc)<200:found_types.add(exc)
                      match=re.search(r"(?:SqlState|SQLSTATE|PostgresErrorCodes)[=: ]+([0-9A-Z]{5})",line)
                      if match: print("RESET_DIAG_SQLSTATE",project,service,match.group(1))
                      frame=re.search(r"(?:at |   at )((?:Dhole|Microsoft[.]EntityFrameworkCore|Npgsql)[\w.]+)\(",line)
                      if frame: print("RESET_DIAG_STACK",project,service,frame.group(1)[:170])
                  for exc in sorted(found_types):print("RESET_DIAG_EXCEPTION",project,service,exc)
          # An upstream gateway may strip method names from log messages; collect
          # only exception *types* and SQLSTATE codes across recent API logs.
          for key,container in rows.items():
              if "api" not in key[1]:continue
              ids=container.get("Id")
              out=command(["docker","logs","--since","40m",ids])
              log=(out.stdout+"\\n"+out.stderr)
              types={}
              for exc in re.findall(r"\b(?:System|Npgsql|Microsoft|Dhole|CustomCodeFramework)[.][\w.]*Exception\b",log):
                  types[exc]=types.get(exc,0)+1
              for exc,n in sorted(types.items(),key=lambda x:-x[1])[:12]:
                  print("RESET_DIAG_RECENT_EXCEPTION_TYPE",key[0],key[1],exc,n)
              for code in sorted(set(re.findall(r"(?i)(?:sqlstate|sql state)[\\s:=\\\"]+([0-9A-Z]{5})",log))):
                  print("RESET_DIAG_RECENT_SQLSTATE",key[0],code)
              for phrase in ("An unhandled exception","ExceptionHandlerMiddleware","Request finished","DbUpdateException","PostgresException","InvalidOperationException","The LINQ expression","Connection is already open"):
                  print("RESET_DIAG_RECENT_TERM",key[0],phrase.replace(" ","_"),log.lower().count(phrase.lower()))
          source=rows.get(("dhole","dhole-agent-api"))
          if not source:raise SystemExit("RESET_DIAG_NO_API")
          env=dict(x.split("=",1) for x in source["Config"].get("Env",[]) if "=" in x)
          connection=env.get("Postgres__ConnectionString") or env.get("AGENT_POSTGRES_CONNECTION_STRING")
          if not connection:raise SystemExit("RESET_DIAG_NO_DB_CONFIG")
          c=dict(x.split("=",1) for x in connection.split(";") if "=" in x)
          if not all(c.get(k) for k in ("Database","Username","Password")):raise SystemExit("RESET_DIAG_INVALID_DB_CONFIG")
          def query(name,sql):
              environment=os.environ.copy()
              environment["PGPASSWORD"]=c["Password"]
              environment["PGOPTIONS"]="-c default_transaction_read_only=on"
              args=["docker","run","--rm","--pull","never","--network","dhole","-e","PGPASSWORD","-e","PGOPTIONS","postgres:17-alpine","psql","-X","-t","-A","-F","|","-v","ON_ERROR_STOP=1","-h",c.get("Host","postgres"),"-p",c.get("Port","5432"),"-U",c["Username"],"-d",c["Database"],"-c",sql]
              result=command(args,env=environment)
              if result.returncode:
                  print("RESET_DIAG_DB_ERROR",name,result.returncode)
              else:
                  for line in result.stdout.splitlines()[:20]:
                      if len(line)<200 and re.fullmatch(r"[A-Za-z0-9_|: .+\-]+",line):
                          print("RESET_DIAG_DB",name,line)
          query("circuit",f"""SELECT state,requires_operator,reason_code,updated_at_utc FROM agent.maersk_circuits WHERE provider_id='{PROVIDER}'""")
          query("profiles",f"""SELECT status,count(*),count(*) FILTER (WHERE last_login_at IS NOT NULL AND last_login_at>(SELECT updated_at_utc FROM agent.maersk_circuits WHERE provider_id='{PROVIDER}')) AS verified_after_block FROM agent."BrowserProfiles" WHERE provider_id='{PROVIDER}' AND NOT is_deleted AND is_active GROUP BY status ORDER BY status""")
          query("profile_summary",f"""SELECT count(*),count(*) FILTER (WHERE is_active AND NOT is_deleted),count(*) FILTER (WHERE status='Authenticated' AND is_active AND NOT is_deleted),count(*) FILTER (WHERE is_active AND NOT is_deleted AND status IN ('Blocked','Expired','ResetRequested')) FROM agent."BrowserProfiles" WHERE provider_id='{PROVIDER}'""")
          query("running",f"""SELECT count(*) FROM agent."AgentExecutions" WHERE provider_id='{PROVIDER}' AND status='Running'""")
          print("RESET_DIAG_FINISHED_READ_ONLY")
          PY

      - name: Locate reset error across ingress and API containers (read-only)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess,json,re
          def run(args):
              return subprocess.run(args,capture_output=True,text=True,timeout=35)
          ids=run(["docker","ps","-q"]).stdout.splitlines()
          markers=["0HNP81I5M5H1H","0HNP660QNPSCD","maersk-circuit/2155f49f","/maersk-circuit/","ResetByOperatorAsync"]
          for cid in ids:
              details=run(["docker","inspect",cid])
              if details.returncode: continue
              info=json.loads(details.stdout)[0]
              labels=info["Config"].get("Labels",{})
              service=labels.get("com.docker.compose.service","")
              project=labels.get("com.docker.compose.project","")
              if not any(term in service.lower() for term in ("gateway","api","web","traefik")):continue
              raw=run(["docker","logs","--since","4h","--tail","30000",cid])
              lines=(raw.stdout+"\n"+raw.stderr).splitlines()
              matches=[i for i,line in enumerate(lines) if any(term in line for term in markers)]
              errors=[(i,line) for i,line in enumerate(lines) if re.search(r"(?:\b5[0-9]{2}\b|exception|unhandled)",line,re.I)]
              print("RESET_ROUTE_SERVICE",project,service,"total_lines="+str(len(lines)),"incident_matches="+str(len(matches)),"errors="+str(len(errors)))
              if matches:
                  for idx in matches[-5:]:
                      for line in lines[max(0,idx-5):min(len(lines),idx+12)]:
                          types=set(re.findall(r"\b(?:System|Npgsql|Microsoft|Dhole|CustomCodeFramework)[.]\w+(?:[.]\w+)*Exception\b",line))
                          frames=re.findall(r"(?:at )((?:Dhole|Microsoft|Npgsql)[.\w]+)\(",line)
                          for typ in sorted(types)[:3]:print("RESET_ROUTE_EXCEPTION",service,typ)
                          for frame in frames[:4]:print("RESET_ROUTE_FRAME",service,frame[:150])
          print("RESET_ROUTE_DIAG_FINISHED")
          PY
