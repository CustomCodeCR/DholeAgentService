name: Build isolated Maersk standby Inspector

on:
  push:
    branches: [master, develop]
    paths:
      - src/Dhole.Agent.Workers/StandbyAccountInspector.cs
      - scripts/standby-authentication.py
      - scripts/standby-hub-auto-inspect.py
      - tests/test_standby_authentication.py
      - tests/test_standby_auth_state.py
      - tests/test_standby_auth_auto.py
      - docker/start-standby-auth.sh
      - .github/workflows/build-standby-inspector.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: dhole-agent-standby-inspector-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, linux, x64, dhole]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate standalone standby inspector
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/standby-authentication.py
          bash -n docker/start-standby-auth.sh
          python3 -m unittest discover -s tests -p 'test_standby_auth*.py' -v
      - name: Build versioned Worker image without touching prod1
        if: ${{ github.ref == 'refs/heads/master' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.NUGET_PACKAGES_READ_TOKEN || github.token }}
          NUGET_PACKAGE_USER: ${{ vars.NUGET_PACKAGES_ACTOR || github.actor }}
        run: |
          set -euo pipefail
          set +x
          [[ -n "$GITHUB_TOKEN" && -n "$NUGET_PACKAGE_USER" ]] || {
            echo "STANDBY_NUGET_CREDENTIAL_MISSING" >&2
            exit 2
          }
          status="$(printf 'user = "%s:%s"\n' "$NUGET_PACKAGE_USER" "$GITHUB_TOKEN" | \
            curl --config - --silent --show-error --max-time 20 \
              --output /dev/null --write-out '%{http_code}' \
              "https://nuget.pkg.github.com/CustomCodeCR/download/customcodeframework.core/index.json")"
          if [[ "$status" != 200 ]]; then
            echo "STANDBY_NUGET_PACKAGE_ACCESS_REFUSED http_status=$status" >&2
            echo "Grant DholeAgentService Actions access to CustomCodeFramework packages, or set NUGET_PACKAGES_READ_TOKEN (read:packages) and NUGET_PACKAGES_ACTOR." >&2
            exit 2
          fi
          tag="standby-inspector-$(git rev-parse --short=12 HEAD)"
          docker build --target worker-final \
            --build-arg "GITHUB_ACTOR=$NUGET_PACKAGE_USER" \
            --secret id=github_token,env=GITHUB_TOKEN \
            -t "dhole/agent-workers:$tag" .
          docker image inspect "dhole/agent-workers:$tag" >/dev/null
          echo "STANDBY_INSPECTOR_IMAGE_READY=$tag"
          echo "Standby viewers require an authorized restart; prod1 and browser volumes are unchanged."
