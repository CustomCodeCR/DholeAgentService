name: Build isolated Maersk standby Inspector

on:
  push:
    branches: [master, develop]
    paths:
      - src/Dhole.Agent.Workers/StandbyAccountInspector.cs
      - scripts/standby-authentication.py
      - scripts/standby-hub-auto-inspect.py
      - scripts/ensure-standby-hub-probe.sh
      - tests/test_standby_authentication.py
      - tests/test_standby_auth_state.py
      - tests/test_standby_auth_auto.py
      - docker/start-standby-auth.sh
      - .github/workflows/build-standby-inspector.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: dhole-agent-standby-inspector-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, linux, x64, dhole]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate standalone standby inspector
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/standby-authentication.py
          bash -n scripts/ensure-standby-hub-probe.sh
          bash -n docker/start-standby-auth.sh
          python3 -m unittest discover -s tests -p 'test_standby_auth*.py' -v
      - name: Ensure current versioned standalone Inspector image
        if: ${{ github.ref == 'refs/heads/master' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.NUGET_PACKAGES_READ_TOKEN || github.token }}
          NUGET_PACKAGE_USER: ${{ vars.NUGET_PACKAGES_ACTOR || github.actor }}
        run: |
          set -euo pipefail
          bash scripts/ensure-standby-hub-probe.sh
          echo "STANDBY_INSPECTOR_IMAGE_READY"
          echo "All prod1 and prod2+ Workers, viewers and profiles remain unchanged."
