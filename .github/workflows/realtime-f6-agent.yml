name: Realtime F6.12 Agent safe Outbox (isolated)
on:
  push:
    branches: [feature/dhole-realtime-universal-rt-20261107-01]
    paths:
      - 'src/Dhole.Agent.Persistence/DbContexts/ServiceDbContext.cs'
      - 'src/Dhole.Agent.Persistence/Messaging/AgentRealtimeInvalidation.cs'
      - 'src/Dhole.Agent.Workers/Outbox/OutboxProcessor.cs'
      - 'tests/**/F6AgentRealtimeContractTests.cs'
      - 'version.json'
      - 'Directory.Build.targets'
      - 'CHANGELOG.md'
      - '.github/workflows/realtime-f6-agent.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  f6-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Enforce component and ecosystem SemVer
        run: python3 scripts/verify_dhole_version.py
      - name: Authenticate GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget update source github --username github-actions --password "$GITHUB_TOKEN" --store-password-in-clear-text --configfile NuGet.Config
      - name: Restore Agent test projects
        run: dotnet restore tests/Dhole.Agent.IntegrationTests/Dhole.Agent.IntegrationTests.csproj --configfile NuGet.Config
      - name: Build Agent API and tests
        run: dotnet build tests/Dhole.Agent.IntegrationTests/Dhole.Agent.IntegrationTests.csproj -c Release --no-restore
      - name: Build Agent Outbox worker
        run: dotnet build src/Dhole.Agent.Workers/Dhole.Agent.Workers.csproj -c Release
      - name: Run F6.12 metadata safety tests
        run: dotnet test tests/Dhole.Agent.IntegrationTests/Dhole.Agent.IntegrationTests.csproj -c Release --no-build --filter FullyQualifiedName~F6AgentRealtimeContractTests -- RunConfiguration.TreatNoTestsAsError=true
