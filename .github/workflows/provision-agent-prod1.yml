name: Provision isolated Agent production generation

on:
  push:
    branches: [master, develop]
    paths:
      - .github/workflows/provision-agent-prod1.yml
      - scripts/provision-production-generation.sh
  workflow_dispatch:
    inputs:
      generation:
        description: "New numbered production generation (prod2, prod3, ...)"
        type: string
        required: true
        default: prod2
      mode:
        description: "Read-only preflight or create dormant runtime"
        type: choice
        required: true
        default: check
        options: [check, apply]
      confirmation:
        description: "For apply type PROVISION_INDEPENDENT_GENERATION"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: dhole-agent-production
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate provisioning script and policy
        run: |
          set -euo pipefail
          bash -n scripts/provision-production-generation.sh
          python3 -m unittest discover -s tests -p 'test_production_generation_*.py' -v
          echo "GENERATION_PROVISION_DEFINITION_VALIDATED; host untouched"

  provision:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, linux, x64, dhole]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate requested generation and authorization
        shell: bash
        env:
          GENERATION: ${{ inputs.generation }}
          REQUEST_MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$GENERATION" =~ ^prod[1-9][0-9]*$ ]] && [[ "${#GENERATION}" -le 64 ]] || exit 2
          if [[ "$REQUEST_MODE" == apply ]]; then
            [[ "$CONFIRMATION" == PROVISION_INDEPENDENT_GENERATION ]] || exit 2
          fi
          python3 -m unittest discover -s tests -p 'test_production_generation_*.py' -v
      - name: Prepare private production configuration
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch master https://github.com/CustomCodeCR/DholeSystem.git .dhole-system
          mkdir -p "$RUNNER_TEMP/agent-generation-env"
          bash .dhole-system/deploy/prepare-environments.sh \
            /opt/dhole/.env "$RUNNER_TEMP/agent-generation-env" >/dev/null
          echo "PREPARED_AGENT_ENV=$RUNNER_TEMP/agent-generation-env/.env.production" >> "$GITHUB_ENV"
      - name: Pass scoped GitHub dispatcher credential to the dormant standby Worker
        shell: bash
        env:
          GENERATION_ACTIONS_TOKEN: ${{ secrets.GENERATION_ORCHESTRATOR_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$GENERATION_ACTIONS_TOKEN" ]]; then
            echo 'GENERATION_STANDBY_DISPATCHER_DISABLED_NO_TOKEN'
            exit 0
          fi
          chmod 600 "$PREPARED_AGENT_ENV"
          sed -i '/^GenerationOrchestrator__GitHubToken=/d' "$PREPARED_AGENT_ENV"
          echo "GenerationOrchestrator__GitHubToken=$GENERATION_ACTIONS_TOKEN" >> "$PREPARED_AGENT_ENV"
          if grep -q '^GenerationOrchestrator__Enabled=' "$PREPARED_AGENT_ENV"; then
            sed -i 's/^GenerationOrchestrator__Enabled=.*/GenerationOrchestrator__Enabled=true/' "$PREPARED_AGENT_ENV"
          else
            echo 'GenerationOrchestrator__Enabled=true' >> "$PREPARED_AGENT_ENV"
          fi
          echo 'GENERATION_STANDBY_DISPATCHER_CONFIGURED'
      - name: Provision isolated standby without starting its Worker
        shell: bash
        env:
          GENERATION: ${{ inputs.generation }}
          REQUEST_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          bash scripts/provision-production-generation.sh \
            "$GENERATION" "$REQUEST_MODE" .dhole-system "$PREPARED_AGENT_ENV"

      - name: Persist successful infrastructure provisioning state
        if: ${{ success() && inputs.mode == 'apply' }}
        shell: bash
        env:
          GENERATION: ${{ inputs.generation }}
        run: |
          set -euo pipefail
          python3 scripts/production-generation-provision-status.py \
            --generation "$GENERATION" --status Provisioned \
            --env-file "$PREPARED_AGENT_ENV"

      - name: Persist provisioning failure without changing browser data
        if: ${{ failure() && inputs.mode == 'apply' }}
        shell: bash
        env:
          GENERATION: ${{ inputs.generation }}
        run: |
          set -euo pipefail
          if [[ -n "${PREPARED_AGENT_ENV:-}" && -r "${PREPARED_AGENT_ENV:-}" ]]; then
            python3 scripts/production-generation-provision-status.py \
              --generation "$GENERATION" --status Failed \
              --env-file "$PREPARED_AGENT_ENV"
          fi
