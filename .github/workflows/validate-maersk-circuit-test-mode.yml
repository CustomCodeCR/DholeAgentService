name: Validate Maersk circuit toggle (offline)

on:
  pull_request:
    paths:
      - 'scripts/maersk-circuit-test-mode.sh'
      - 'scripts/prepare-prod1-jwt-env.py'
      - 'scripts/repair-prod1-jwt-runtime.py'
      - 'scripts/deploy-active-prod1-npgsql-hotfix.sh'
      - '.github/workflows/repair-prod1-jwt-runtime.yml'
      - 'scripts/tests/test-maersk-circuit-test-mode.sh'
      - '.github/workflows/maersk-circuit-test-mode.yml'
      - '.github/workflows/validate-maersk-circuit-test-mode.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax and run simulated Docker toggle
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/prepare-prod1-jwt-env.py scripts/repair-prod1-jwt-runtime.py
          if [[ -f scripts/deploy-active-prod1-npgsql-hotfix.sh ]]; then
            bash -n scripts/deploy-active-prod1-npgsql-hotfix.sh
          fi
          bash -n scripts/maersk-circuit-test-mode.sh
          bash -n scripts/tests/test-maersk-circuit-test-mode.sh
          bash scripts/tests/test-maersk-circuit-test-mode.sh
