name: Diagnose Agent Worker Startup (staging, read-only)
on:
  push:
    branches:
      - fix/maersk-phase2-worker-boot-diagnostic-20261010
    paths:
      - '.github/workflows/diagnose-staging-agent-worker.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, dhole]
    timeout-minutes: 10
    steps:
      - name: Inspect exact worker state, boot markers and exception categories
        shell: bash
        run: |
          set -euo pipefail
          set +x
          project=dhole-staging
          for svc in dhole-agent-api dhole-agent-workers; do
            cid="$(docker ps -aq --filter "label=com.docker.compose.project=$project" --filter "label=com.docker.compose.service=$svc" | head -n1)"
            if [[ -z "$cid" ]]; then echo "SERVICE_ABSENT=$svc"; continue; fi
            echo "SERVICE=$svc"
            docker inspect -f 'CONTAINER_ID={{.Id}} IMAGE_ID={{.Image}} STATUS={{.State.Status}} EXIT_CODE={{.State.ExitCode}} OOM={{.State.OOMKilled}} START={{.State.StartedAt}} FINISH={{.State.FinishedAt}} RESTARTS={{.RestartCount}}' "$cid"
            if [[ "$svc" = dhole-agent-workers ]]; then
              docker logs --since 12m --tail 2000 "$cid" 2>&1 | python3 -c 'import collections,re,sys; s=sys.stdin.read(); patterns={"ENTRYPOINT":r"AGENT_WORKER_ENTRYPOINT_STARTED","XVFB_READY":r"AGENT_WORKER_XVFB_READY","XVFB_FAILURE":r"AGENT_WORKER_XVFB_(?:FAILED|TIMEOUT|NOT_FOUND)","X11VNC_READY":r"AGENT_WORKER_X11VNC_READY","X11VNC_FAILURE":r"AGENT_WORKER_X11VNC_(?:FAILED|NOT_FOUND|TIMEOUT)","NOVNC_READY":r"AGENT_WORKER_NOVNC_READY","NOVNC_FAILURE":r"AGENT_WORKER_NOVNC_(?:FAILED|NOT_FOUND|TIMEOUT|WEB_ROOT_NOT_FOUND)","DOTNET_START":r"AGENT_WORKER_DOTNET_STARTING","PUMP_STARTED":r"AGENT_QUEUE_PUMP_STARTED","PUMP_ERRORS":r"AGENT_QUEUE_PUMP_ERROR","FATAL":r"\\bFATAL\\b","DB_CONNECT":r"connection refused|failed to connect|connection timeout|password authentication failed","PROCESS_EXIT":r"Process terminated|Application is shutting down|Host terminated unexpectedly","MIGRATION_FAILURE":r"migration.*failed|already exists|relation .* does not exist|SqlState:","CRASH":r"Unhandled exception|Failed to start|crit:"}; [print("MARKER_"+k+"="+str(len(re.findall(v,s,re.I)))) for k,v in patterns.items()]; errors=re.findall(r"(?:[A-Za-z_][A-Za-z0-9_]*\\.)*[A-Za-z_][A-Za-z0-9_]*(?:Exception|Error)\\b",s); [print("EXCEPTION_TYPE="+v) for v in list(dict.fromkeys(errors))[:18]]; classifiers={"HOST_BACKGROUND_SERVICE":r"BackgroundService failed","HOST_STOP_BEHAVIOR":r"BackgroundServiceExceptionBehavior","DOTNET_CRITICAL":r"crit:","INVALID_OPERATION":r"InvalidOperationException","UNHANDLED_EXCEPTION":r"Unhandled exception","WORKER_TERMINATED":r"Application is shutting down","STARTUP_FAILED":r"Failed to start","CANCELED":r"TaskCanceledException|OperationCanceledException","DB_SCHEMA":r"relation .* does not exist|column .* does not exist|migration","NULL_REFERENCE":r"NullReferenceException","DI_ERROR":r"Unable to resolve service|No service for type|Cannot consume scoped service","LIFETIME":r"Lifetime|HostedService"}; [print("ERROR_CATEGORY_"+k+"="+str(len(re.findall(v,s,re.I)))) for k,v in classifiers.items()]; frames=re.findall(r"at (Dhole\\.Agent\\.Workers\\.[A-Za-z0-9_.<>]+|CustomCodeFramework\\.[A-Za-z0-9_.<>]+)",s); [print("WORKER_EXCEPTION_FRAME="+name) for name in list(dict.fromkeys(frames))[:15]]; allowed=set("worker background task schedule provider repository execution profile monitoring browser expired migration schema database databasecontext postgres connection redacted table column constraint client queue dispatch dispatcher consumer producer stream redis outbox inbox service scope lifetime scoped singleton transient host hosted failure failed configuration configured disabled invalid operation options required missing not found reference does exists initialized startup seed data event pending duplicate record application authorization circular circularity timeout entrypoint build checkpoint heartbeat null value critical validation no source assembly key".split()); notes=re.findall(r"InvalidOperationException:\\s*([^\\n\\r]{1,400})",s); [print("EXCEPTION_MESSAGE_KEYWORDS="+",".join(w for w in re.findall(r"[A-Za-z]+",line.lower()) if w in allowed)[:400]) for line in list(dict.fromkeys(notes))[:2]]; print("LOG_CHARS_REDACTED="+str(len(s)))'
            fi
          done
