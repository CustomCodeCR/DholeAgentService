name: Validate Dhole Agent

on:
  pull_request:
    branches: [develop, master]
  push:
    branches:
      - develop
      - "feature/**"
      - "fix/**"
      - "chore/**"

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache CustomCodeFramework local feed
        id: ccf-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccf-feed
          key: ccf-feed-18e98bcc1913a7aadfea2b1d3cd8b3cf179bfa97

      - name: Build CustomCodeFramework local feed
        if: steps.ccf-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch master https://github.com/CustomCodeCR/CustomCodeFramework.git "$RUNNER_TEMP/CustomCodeFramework"
          mkdir -p "$RUNNER_TEMP/ccf-feed"
          projects=(
            CustomCodeFramework.Core
            CustomCodeFramework.Validation
            CustomCodeFramework.Cqrs
            CustomCodeFramework.Auth
            CustomCodeFramework.Observability
            CustomCodeFramework.Persistence
            CustomCodeFramework.Messaging
            CustomCodeFramework.Redis
            CustomCodeFramework.Workers
            CustomCodeFramework.Api
            CustomCodeFramework.Auth.Redis
            CustomCodeFramework.Postgres
            CustomCodeFramework.Postgres.EntityFramework
            CustomCodeFramework.Redis.Streams
            CustomCodeFramework.Messaging.Outbox
          )
          for name in "${projects[@]}"; do
            dotnet pack "$RUNNER_TEMP/CustomCodeFramework/src/$name/$name.csproj" \
              --configuration Release \
              --output "$RUNNER_TEMP/ccf-feed"
          done
      - name: Configure CustomCodeFramework local feed
        run: |
          dotnet nuget add source "$RUNNER_TEMP/ccf-feed" \
            --name ccf-local \
            --configfile NuGet.Config
          dotnet nuget disable source github --configfile NuGet.Config
          sed -i 's/packageSource key="github"/packageSource key="ccf-local"/' NuGet.Config

      - name: Restore
        run: dotnet restore DholeAgentService.slnx --configfile NuGet.Config

      - name: Build
        run: dotnet build DholeAgentService.slnx --configuration Release --no-restore

      - name: Test
        env:
          AGENT_QUEUE_POSTGRES_TEST_CONNECTION: "Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres"
        run: dotnet test DholeAgentService.slnx --configuration Release --no-build --verbosity normal

      # A successful test process alone is not proof that PostgreSQL acceptance
      # tests ran. Require four explicit passing scenario names (not skipped or
      # inconclusive) before a phase-7 PR can be merged.
      - name: Phase 7 Maersk acceptance gate (PostgreSQL 16)
        env:
          AGENT_QUEUE_POSTGRES_TEST_CONNECTION: "Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres"
        run: |
          set -euo pipefail
          dotnet test tests/Dhole.Agent.IntegrationTests/Dhole.Agent.IntegrationTests.csproj \
            --configuration Release --no-build --no-restore \
            --filter "FullyQualifiedName~MaerskPhase7AcceptancePostgresTests" \
            --logger "console;verbosity=normal" | tee /tmp/maersk-phase7-acceptance.log
          for scenario in \
            CaptchaPausesOriginalJob_WithoutStarvingOtherProvider \
            VerifiedResetCannotClearCircuitWhileRunningLeaseIsActive \
            TechnicalRetryRespectsBackoff_AndPreservesOriginalSnapshotAcrossOwners \
            DisabledMonitoringCannotAcknowledgeOrMutateExistingIncident; do
            grep -F "Passed ${scenario}" /tmp/maersk-phase7-acceptance.log
          done

      - name: Phase 2 Maersk circuit acceptance gate (PostgreSQL integration)
        env:
          AGENT_QUEUE_POSTGRES_TEST_CONNECTION: "Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres"
        run: |
          set -euo pipefail
          dotnet test tests/Dhole.Agent.IntegrationTests/Dhole.Agent.IntegrationTests.csproj \
            --configuration Release --no-build --no-restore \
            --filter "FullyQualifiedName~MaerskCircuitPostgresIntegrationTests" \
            --logger "console;verbosity=normal" | tee /tmp/maersk-phase2-acceptance.log
          for scenario in \
            CaptchaAnd429_StayOpenEvenAfterCooldownUntilVerifiedOperatorReset \
            DuplicateCaptchaDelivery_OpensOnceAndPersistsAfterNewContext \
            TimeoutThenCaptchaOnSameExecution_EscalatesToOperatorOpen \
            TechnicalThreshold_AllowsOnlyOneHalfOpenProbeAcrossWorkers \
            FailedProbe_ReopensForCooldownWithoutRotatingProviderIdentity \
            OperatorReset_FailsClosedUntilBlockedProfileIsReauthenticated; do
            grep -F "Passed ${scenario}" /tmp/maersk-phase2-acceptance.log || {
              echo "Phase 2 mandatory PostgreSQL scenario missing, failed or skipped: $scenario" >&2
              exit 1
            }
          done

      - name: Phase 3 durable queue acceptance gate (real PostgreSQL)
        env:
          AGENT_QUEUE_POSTGRES_TEST_CONNECTION: "Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres"
        run: |
          set -euo pipefail
          dotnet test tests/Dhole.Agent.IntegrationTests/Dhole.Agent.IntegrationTests.csproj \
            --configuration Release --no-build --no-restore \
            --filter "FullyQualifiedName~AgentQueuePostgresIntegrationTests" \
            --logger "console;verbosity=normal" | tee /tmp/maersk-phase3-acceptance.log
          for scenario in \
            CompetingWorkers_ClaimOnlyOnceAndEnforceOwnerHeartbeat \
            ExpiredRunningLease_BecomesInterruptedWithoutReplaying \
            LargeMaerskBacklog_DoesNotHideOtherProvidersOrCron \
            WaitingForAuthentication_IsNotClaimableAndDoesNotHideOtherProviders \
            OneMaerskProviderLease_DoesNotBlockUnrelatedProviderOnAnotherWorker \
            LegacyRunningWithoutLease_ExpiresAsFailedAndNeverReplaysAutomatically; do
            grep -F "Passed ${scenario}" /tmp/maersk-phase3-acceptance.log || {
              echo "Phase 3 mandatory queue scenario missing, failed or skipped: $scenario" >&2
              exit 1
            }
          done

      - name: Phase 5 verified recovery and idempotent resume acceptance
        env:
          AGENT_QUEUE_POSTGRES_TEST_CONNECTION: "Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres"
        run: |
          set -euo pipefail
          dotnet test tests/Dhole.Agent.IntegrationTests/Dhole.Agent.IntegrationTests.csproj \
            --configuration Release --no-build --no-restore \
            --filter "FullyQualifiedName~MaerskPhase5ResumePostgresTests" \
            --logger "console;verbosity=normal" | tee /tmp/maersk-phase5-acceptance.log
          for scenario in \
            ResumeRejectsAttestationWithoutFreshSessionAndOpenCircuit \
            ResumeIsIdempotentAuditedAndPreservesOriginalIdentifiers \
            ExhaustedAttemptsRemainWaitingAfterVerifiedRecovery; do
            grep -F "Passed ${scenario}" /tmp/maersk-phase5-acceptance.log || {
              echo "Phase 5 mandatory PostgreSQL scenario missing, failed or skipped: $scenario" >&2
              exit 1
            }
          done

      - name: Phase 8 guarded rollout regression tests
        run: |
          set -euo pipefail
          bash -n scripts/maersk-phase8-preflight.sh
          bash -n scripts/maersk-phase8-backup.sh
          bash -n scripts/tests/test-maersk-phase8-preflight.sh
          bash scripts/tests/test-maersk-phase8-preflight.sh
          bash -n scripts/tests/test-maersk-phase8-workflows.sh
          bash scripts/tests/test-maersk-phase8-workflows.sh
          bash -n scripts/maersk-phase8-image-rollback.sh
          bash -n scripts/maersk-phase8-restore-drill.sh
          bash scripts/tests/test-maersk-phase8-rollback.sh
          bash -n scripts/maersk-phase8-schema-check.sh
          bash scripts/tests/test-maersk-phase8-schema-check.sh

      - name: Maersk phase 2 circuit activation safety regression
        run: |
          set -euo pipefail
          bash -n scripts/maersk-phase2-activate.sh
          bash scripts/tests/test-maersk-phase2-activate.sh

      - name: Maersk phase 1 read-only diagnostic regression
        run: |
          set -euo pipefail
          bash -n scripts/inspect-maersk-phase1.sh
          bash scripts/tests/test-maersk-phase1-inspect.sh
